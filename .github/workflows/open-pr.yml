name: Open PR in target repo

on:
  workflow_dispatch:
    inputs:
      message:
        description: Line to append to synced.txt in the target repo
        default: hello from the source repo

# The default GITHUB_TOKEN only works on this repo; the App token does the cross-repo work.
permissions: {}

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Mint an installation token for the target repo
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.TARGET_REPO }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the target repo with the App token
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/${{ vars.TARGET_REPO }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Commit, push and open the PR as the App
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
          TARGET: ${{ github.repository_owner }}/${{ vars.TARGET_REPO }}
          MESSAGE: ${{ inputs.message }}
        run: |
          bot_id=$(gh api "/users/$BOT" --jq .id)
          git config user.name "$BOT"
          git config user.email "$bot_id+$BOT@users.noreply.github.com"

          branch="sync/$GITHUB_RUN_ID"
          git switch -c "$branch"
          echo "$MESSAGE" >> synced.txt
          git add synced.txt
          git commit -m "Sync from $GITHUB_REPOSITORY@${GITHUB_SHA::7}"
          git push origin "$branch"

          gh pr create --repo "$TARGET" --head "$branch" \
            --title "Sync from $GITHUB_REPOSITORY" \
            --body "Opened by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
